<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Keranjang — Nara Kitchen</title><script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&family=Material+Symbols+Outlined&display=swap" rel="stylesheet"><style>body{background:#121212;color:#f5f5f5;font-family:Inter}.display{font-family:'Playfair Display'}.primary{color:#c84c2c}.bgp{background:#c84c2c}.card{background:#1c1c1c;border:1px solid #383838}</style><script src="js/supabase-config.js"></script><script src="js/supabase.js"></script><script src="js/orderin.js"></script></head><body class="min-h-screen pb-28"><header class="sticky top-0 z-40 bg-[#121212]/95 backdrop-blur border-b border-[#333] px-5 py-4"><div class="max-w-3xl mx-auto flex items-center justify-between"><a href="index.html" class="text-2xl display primary">Nara Kitchen</a><a href="index.html" class="text-sm text-gray-400">← Kembali ke menu</a></div></header><main class="max-w-3xl mx-auto px-5 py-8"><p class="text-xs uppercase tracking-[.2em] text-gray-500">ORDERIN</p><h1 class="display text-4xl mt-2">Keranjang</h1><div id="cart" class="mt-8 space-y-4"></div><div id="empty" class="hidden card rounded-2xl p-8 text-center"><span class="material-symbols-outlined text-5xl text-gray-600">shopping_cart</span><h2 class="display text-2xl mt-3">Keranjang masih kosong</h2><a href="index.html" class="inline-block mt-5 bgp text-white px-6 py-3 rounded-xl">Pilih Menu</a></div><div id="summary" class="hidden card rounded-2xl p-6 mt-8"><div class="flex justify-between text-gray-400"><span>Subtotal</span><b id="subtotal" class="text-white"></b></div><div class="flex justify-between text-gray-400 mt-3"><span>Ongkos kirim</span><b>Rp 12.000</b></div><div class="border-t border-[#333] mt-5 pt-5 flex justify-between"><span class="display text-xl">Total</span><b id="total" class="primary text-xl"></b></div><button id="checkout" class="w-full bgp text-white py-4 rounded-xl mt-6 font-semibold">Lanjut Checkout</button></div></main><script>
function renderCart(){const c=Orderin.getCart(),wrap=document.getElementById('cart'),empty=document.getElementById('empty'),sum=document.getElementById('summary');wrap.innerHTML='';if(!c.length){empty.classList.remove('hidden');sum.classList.add('hidden');return}empty.classList.add('hidden');sum.classList.remove('hidden');c.forEach((i,idx)=>{const el=document.createElement('div');el.className='card rounded-2xl p-4 flex gap-4 items-center';el.innerHTML=`<img src="${i.img}" class="w-20 h-20 rounded-xl object-cover" onerror="this.style.display='none'"><div class="flex-1"><h3 class="display text-xl">${i.name}</h3><p class="primary mt-1">${Orderin.money(i.price)}</p><div class="flex items-center gap-3 mt-3"><button class="w-8 h-8 rounded-full bg-[#2a2a2a]" onclick="change(${idx},-1)">−</button><span>${i.qty}</span><button class="w-8 h-8 rounded-full bgp" onclick="change(${idx},1)">+</button></div></div><button class="text-gray-500" onclick="removeItem(${idx})">×</button>`;wrap.appendChild(el)});const sub=c.reduce((a,i)=>a+i.price*i.qty,0);document.getElementById('subtotal').textContent=Orderin.money(sub);document.getElementById('total').textContent=Orderin.money(sub+12000)}
function change(i,d){const c=Orderin.getCart();c[i].qty+=d;if(c[i].qty<1)c.splice(i,1);Orderin.saveCart(c);renderCart()}function removeItem(i){const c=Orderin.getCart();c.splice(i,1);Orderin.saveCart(c);renderCart()}document.getElementById('checkout').onclick=()=>location.href='checkout.html';document.addEventListener('DOMContentLoaded',renderCart);</script></body></html>
