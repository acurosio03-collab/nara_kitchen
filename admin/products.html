<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Produk — NARA</title><link rel="stylesheet" href="../css/style.css"><script src="../js/supabase-config.js"></script><script src="../js/supabase.js"></script><script src="../js/data.js"></script></head><body><div id="app"></div><script>
async function boot(){if(!dbReady){app.innerHTML='<div class="container section"><div class="panel"><h1>Supabase belum dikonfigurasi</h1></div></div>';return}let {data:{session}}=await db.auth.getSession();if(!session){location.href="index.html";return}load()}async function load(){let {data,error}=await db.from("products").select("*").order("created_at",{ascending:false});if(error){app.innerHTML='<div class="container section"><div class="panel">'+error.message+'</div></div>';return}app.innerHTML=`<div class="admin-layout"><aside class="sidebar"><div class="brand">NARA</div><div class="side-links"><a href="dashboard.html">📊 Dashboard</a><a href="orders.html">🧾 Pesanan</a><a href="products.html">📦 Produk</a><a href="../index.html">↗ Website</a></div></aside><main class="admin-main"><div class="section-head"><div><div class="eyebrow">CATALOG</div><h1>Produk</h1></div><button id="add" class="primary">+ Tambah</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Produk</th><th>Kategori</th><th>Harga</th><th>Aksi</th></tr></thead><tbody>${(data||[]).map(p=>`<tr><td>${p.emoji||"🍽️"} <b>${p.name}</b></td><td>${p.category}</td><td>${money(p.price)}</td><td><button class="secondary edit" data-id="${p.id}">Edit</button> <button class="secondary del" data-id="${p.id}">Hapus</button></td></tr>`).join("")}</tbody></table></div></main></div>`;add.onclick=async()=>{let name=prompt("Nama produk");if(!name)return;let price=Number(prompt("Harga","25000"));let category=prompt("Kategori","Nasi");let emoji=prompt("Emoji","🍛");await db.from("products").insert({name,price,category,emoji,description:"Menu NARA KITCHEN",available:true,bestseller:false,variants:[]});load()};document.querySelectorAll(".del").forEach(b=>b.onclick=async()=>{if(confirm("Hapus produk?")){await db.from("products").delete().eq("id",b.dataset.id);load()}});document.querySelectorAll(".edit").forEach(b=>b.onclick=async()=>{let p=data.find(x=>String(x.id)===String(b.dataset.id));let name=prompt("Nama",p.name)||p.name;let price=Number(prompt("Harga",p.price))||p.price;let category=prompt("Kategori",p.category)||p.category;await db.from("products").update({name,price,category}).eq("id",p.id);load()})}boot();
</script></body></html>
