<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard — NARA</title><link rel="stylesheet" href="../css/style.css"><script src="../js/supabase-config.js"></script><script src="../js/supabase.js"></script><script src="../js/data.js"></script></head><body><div id="app"></div><script>
async function boot(){if(!dbReady){app.innerHTML='<div class="container section"><div class="panel"><h1>Supabase belum dikonfigurasi</h1><p>Isi js/supabase-config.js.</p></div></div>';return}let {data:{session}}=await db.auth.getSession();if(!session){location.href="index.html";return}let [p,o]=await Promise.all([db.from("products").select("*",{count:"exact",head:true}),db.from("orders").select("*").order("created_at",{ascending:false}).limit(8)]);let orders=o.data||[];let revenue=orders.filter(x=>x.status!="Dibatalkan").reduce((a,x)=>a+Number(x.total||0),0);app.innerHTML=`<div class="admin-layout"><aside class="sidebar"><div class="brand">NARA</div><div class="side-links"><a href="dashboard.html">📊 Dashboard</a><a href="orders.html">🧾 Pesanan</a><a href="products.html">📦 Produk</a><a href="../index.html">↗ Website</a><a href="#" id="out">↪ Keluar</a></div></aside><main class="admin-main"><div class="section-head"><div><div class="eyebrow">NARA KITCHEN</div><h1>Dashboard</h1></div></div><div class="stats"><div class="stat">Produk<strong>${p.count||0}</strong></div><div class="stat">Pesanan<strong>${orders.length}</strong></div><div class="stat">Pesanan Baru<strong>${orders.filter(x=>x.status=="Baru").length}</strong></div><div class="stat">Omzet terbaru<strong>${money(revenue)}</strong></div></div><section class="section"><h2>Pesanan terbaru</h2><div class="table-wrap"><table class="table"><thead><tr><th>Order</th><th>Customer</th><th>Total</th><th>Status</th></tr></thead><tbody>${orders.map(x=>`<tr><td><b>${x.id}</b></td><td>${x.customer_name}<br><small>${x.customer_phone||""}</small></td><td>${money(x.total)}</td><td><span class="badge">${x.status}</span></td></tr>`).join("")||'<tr><td colspan="4" class="empty">Belum ada pesanan.</td></tr>'}</tbody></table></div></section></main></div>`;out.onclick=async e=>{e.preventDefault();await db.auth.signOut();location.href="index.html"}}boot();
</script></body></html>
