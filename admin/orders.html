<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pesanan — NARA</title><link rel="stylesheet" href="../css/style.css"><script src="../js/supabase-config.js"></script><script src="../js/supabase.js"></script><script src="../js/data.js"></script></head><body><div id="app"></div><script>
async function boot(){if(!dbReady){app.innerHTML='<div class="container section"><div class="panel"><h1>Supabase belum dikonfigurasi</h1></div></div>';return}let {data:{session}}=await db.auth.getSession();if(!session){location.href="index.html";return}let {data,error}=await db.from("orders").select("*").order("created_at",{ascending:false});if(error){app.innerHTML='<div class="container section"><div class="panel">'+error.message+'</div></div>';return}app.innerHTML=`<div class="admin-layout"><aside class="sidebar"><div class="brand">NARA</div><div class="side-links"><a href="dashboard.html">📊 Dashboard</a><a href="orders.html">🧾 Pesanan</a><a href="products.html">📦 Produk</a><a href="../index.html">↗ Website</a></div></aside><main class="admin-main"><div class="section-head"><div><div class="eyebrow">ORDERS</div><h1>Pesanan</h1></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Order</th><th>Customer</th><th>Total</th><th>Status</th></tr></thead><tbody>${(data||[]).map(o=>`<tr><td><b>${o.id}</b><br><small>${new Date(o.created_at).toLocaleString("id-ID")}</small></td><td>${o.customer_name}<br><small>${o.customer_phone||""}</small><br><small>${o.customer_address||""}</small></td><td>${money(o.total)}</td><td><select class="status" data-id="${o.id}">${["Baru","Diproses","Selesai","Dibatalkan"].map(s=>`<option ${s===o.status?"selected":""}>${s}</option>`).join("")}</select></td></tr>`).join("")||'<tr><td colspan="4" class="empty">Belum ada pesanan.</td></tr>'}</tbody></table></div></main></div>`;document.querySelectorAll(".status").forEach(x=>x.onchange=async()=>{await db.from("orders").update({status:x.value}).eq("id",x.dataset.id)})}boot();
</script></body></html>
