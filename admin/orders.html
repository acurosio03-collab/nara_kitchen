<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orders — Nara Kitchen</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><style>body{background:#121212;color:#f5f5f5;font-family:Inter}.display{font-family:'Playfair Display'}.primary{color:#c84c2c}</style><script src="../js/supabase-config.js"></script><script src="../js/supabase.js"></script></head><body><main class="max-w-5xl mx-auto px-5 py-8"><a href="dashboard.html" class="primary">← Dashboard</a><h1 class="display text-4xl mt-5">Orders</h1><div id="list" class="mt-8 space-y-4"></div></main><script>async function load(){const l=document.getElementById('list');if(!dbReady){l.textContent='Memuat Supabase...';return setTimeout(load,500)}const s=await db.auth.getSession();if(!s.data.session)return location.href='index.html';const r=await db.from('orders').select('*').order('created_at',{ascending:false});if(r.error){l.textContent=r.error.message;return}l.innerHTML=r.data.map(o=>`<article class="bg-[#1c1c1c] border border-[#383838] rounded-2xl p-5"><div class="flex justify-between"><b>${o.id}</b><span class="primary">${o.status}</span></div><p class="mt-2">${o.customer_name} · ${o.customer_phone}</p><p class="text-gray-400 mt-1">${o.customer_address||''}</p><p class="mt-3 font-semibold">Rp ${Number(o.total).toLocaleString('id-ID')}</p></article>`).join('')||'<p class="text-gray-500">Belum ada pesanan.</p>'}load();</script></body></html>
