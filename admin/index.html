<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Nara Kitchen</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><style>body{background:#121212;color:#f5f5f5;font-family:Inter}.display{font-family:'Playfair Display'}.primary{color:#c84c2c}.bgp{background:#c84c2c}</style><script src="../js/supabase-config.js"></script><script src="../js/supabase.js"></script></head><body><main class="min-h-screen flex items-center justify-center px-5"><section class="w-full max-w-md bg-[#1c1c1c] border border-[#383838] rounded-2xl p-8"><p class="text-xs tracking-[.2em] text-gray-500">MIDNIGHT BISTRO ADMIN</p><h1 class="display text-4xl primary mt-2">Nara Kitchen</h1><p class="text-gray-400 mt-2">Masuk untuk mengelola menu dan pesanan.</p><form id="f" class="space-y-4 mt-8"><input name="email" type="email" required placeholder="Email admin" class="w-full bg-[#121212] border border-[#444] rounded-xl p-3"><input name="password" type="password" required placeholder="Password" class="w-full bg-[#121212] border border-[#444] rounded-xl p-3"><button class="w-full bgp py-3 rounded-xl font-semibold">Masuk ke Admin</button></form><p id="msg" class="text-sm text-red-400 mt-4"></p><a href="../index.html" class="block text-center text-gray-500 text-sm mt-6">← Kembali ke menu</a></section></main><script>document.getElementById('f').onsubmit=async e=>{e.preventDefault();const m=document.getElementById('msg');if(!window.dbReady){m.textContent='Supabase belum siap. Tunggu sebentar lalu coba lagi.';return}const f=new FormData(e.target),r=await db.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});if(r.error)m.textContent=r.error.message;else location.href='dashboard.html'};</script></body></html>
