<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pesanan — Nara Kitchen</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><style>body{background:#121212;color:#f5f5f5;font-family:Inter}.display{font-family:'Playfair Display'}.primary{color:#c84c2c}</style><script src="js/supabase-config.js"></script><script src="js/supabase.js"></script></head><body><main class="max-w-2xl mx-auto px-5 py-10"><a href="index.html" class="primary">← Menu</a><h1 class="display text-4xl mt-6">Pesanan Saya</h1><p class="text-gray-400 mt-2">Masukkan nomor pesanan untuk melihat status.</p><div class="flex gap-2 mt-6"><input id="id" class="flex-1 bg-[#1c1c1c] border border-[#444] rounded-xl p-3" placeholder="ORD-..."><button onclick="cek()" class="bg-[#c84c2c] px-5 rounded-xl">Cek</button></div><div id="out" class="mt-6"></div></main><script>async function cek(){const id=document.getElementById('id').value.trim();const o=document.getElementById('out');if(!id)return;if(!dbReady){o.textContent='Menunggu koneksi...';return}const r=await db.from('orders').select('id,status,customer_name,total,created_at').eq('id',id).single();if(r.error)o.innerHTML='<div class="bg-[#1c1c1c] border border-[#383838] rounded-xl p-5">Pesanan tidak ditemukan.</div>';else o.innerHTML=`<div class="bg-[#1c1c1c] border border-[#383838] rounded-xl p-5"><p class="text-gray-400">${r.data.customer_name}</p><h2 class="display text-2xl mt-2 primary">${r.data.status}</h2><p class="mt-3">${r.data.id}</p></div>`}</script></body></html>
