            background-color: #121212;
            color: #f5f5f5;

            background: #333333;
            border-radius: 4px;

    body {

<body class="antialiased min-h-screen pb-24 md:pb-0 pt-16">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface/80 dark:bg-surface-dim/80 backdrop-blur-xl border-b border-outline-variant flat no shadows flex justify-between items-center h-16 px-margin-mobile md:px-margin-desktop max-w-[1440px] mx-auto">
<div class="flex items-center gap-4">
<button class="text-primary hover:text-primary transition-colors duration-200 cursor-pointer active:opacity-70 flex items-center justify-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'wght' 300, 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-headline-sm-mobile md:font-headline-sm text-headline-sm-mobile md:text-headline-sm text-primary dark:text-primary-fixed-dim">Checkout</h1>
</div>
<div class="hidden md:flex gap-6">
<nav class="flex gap-6">
<!-- Transactional intent, hiding nav items for focus -->
</nav>
</div>
</header>
<main class="max-w-2xl mx-auto px-margin-mobile mt-lg space-y-xl">
<!-- Detail Pengiriman -->
<section class="space-y-md">
<h2 class="font-headline-sm text-headline-sm text-on-surface">Detail Pengiriman</h2>
<div class="bg-surface rounded-xl border border-border p-lg space-y-md">
<div class="space-y-sm">
<label class="font-label-caps text-label-caps text-text-secondary uppercase">Alamat Pengiriman</label>
<div class="relative">
<textarea class="w-full bg-[#121212] border border-border rounded-lg p-md text-on-surface font-body-md focus:border-primary-container focus:ring-0 transition-colors resize-none placeholder:text-surface-variant" placeholder="Masukkan alamat lengkap..." rows="3"></textarea>
<span class="material-symbols-outlined absolute top-md right-md text-surface-variant pointer-events-none">location_on</span>
</div>
</div>
<div class="grid grid-cols-2 gap-md">
<div class="space-y-sm">
<label class="font-label-caps text-label-caps text-text-secondary uppercase">Nama Penerima</label>
<input class="w-full bg-[#121212] border border-border rounded-lg p-md text-on-surface font-body-md focus:border-primary-container focus:ring-0 transition-colors" placeholder="Nama" type="text"/>
</div>
<div class="space-y-sm">
<label class="font-label-caps text-label-caps text-text-secondary uppercase">Nomor Telepon</label>
<input class="w-full bg-[#121212] border border-border rounded-lg p-md text-on-surface font-body-md focus:border-primary-container focus:ring-0 transition-colors" placeholder="08xx..." type="tel"/>
</div>
</div>
</div>
</section>
<!-- Metode Pembayaran -->
<section class="space-y-md">
<h2 class="font-headline-sm text-headline-sm text-on-surface">Metode Pembayaran</h2>
<div class="bg-surface rounded-xl border border-border p-lg space-y-md">
<label class="flex items-center p-md border border-border rounded-lg cursor-pointer hover:bg-surface-bright transition-colors has-[:checked]:border-primary-container has-[:checked]:bg-[#2a2a2a]">
<div class="flex-shrink-0 w-8 h-8 bg-surface-container-highest rounded-full flex items-center justify-center mr-md text-on-surface">
<span class="material-symbols-outlined" style="font-size: 20px;">account_balance_wallet</span>
</div>
<div class="flex-grow">
<p class="font-body-md text-body-md text-on-surface">E-Wallet / QRIS</p>
</div>
<input class="w-5 h-5 text-primary-container bg-[#121212] border-border focus:ring-primary-container focus:ring-offset-surface" name="payment" type="radio"/>
</label>
<label class="flex items-center p-md border border-border rounded-lg cursor-pointer hover:bg-surface-bright transition-colors has-[:checked]:border-primary-container has-[:checked]:bg-[#2a2a2a]">
<div class="flex-shrink-0 w-8 h-8 bg-surface-container-highest rounded-full flex items-center justify-center mr-md text-on-surface">
<span class="material-symbols-outlined" style="font-size: 20px;">credit_card</span>
</div>
<div class="flex-grow">
<p class="font-body-md text-body-md text-on-surface">Kartu Kredit / Debit</p>
</div>
<input class="w-5 h-5 text-primary-container bg-[#121212] border-border focus:ring-primary-container focus:ring-offset-surface" name="payment" type="radio"/>
</label>
<label class="flex items-center p-md border border-border rounded-lg cursor-pointer hover:bg-surface-bright transition-colors has-[:checked]:border-primary-container has-[:checked]:bg-[#2a2a2a]">
<div class="flex-shrink-0 w-8 h-8 bg-surface-container-highest rounded-full flex items-center justify-center mr-md text-on-surface">
<span class="material-symbols-outlined" style="font-size: 20px;">payments</span>
</div>
<div class="flex-grow">
<p class="font-body-md text-body-md text-on-surface">Cash on Delivery</p>
</div>
<input class="w-5 h-5 text-primary-container bg-[#121212] border-border focus:ring-primary-container focus:ring-offset-surface" name="payment" type="radio"/>
</label>
</div>
</section>
<!-- Ringkasan Pesanan -->
<section class="space-y-md">
<h2 class="font-headline-sm text-headline-sm text-on-surface">Ringkasan Pesanan</h2>
<div class="bg-surface rounded-xl border border-border p-lg space-y-md">
<!-- Items -->
<div class="space-y-md border-b border-border pb-md">
<div class="flex justify-between items-start">
<div class="flex gap-md">
<div class="w-16 h-16 rounded-lg bg-surface-container-highest overflow-hidden border border-border flex-shrink-0">
<img class="w-full h-full object-cover" data-alt="A close up shot of a perfectly grilled wagyu beef bowl over steaming rice, garnished with a raw egg yolk and thinly sliced scallions. Served in a matte black ceramic bowl resting on a dark slate table. The lighting is moody and directional, highlighting the gloss on the meat and the rich orange of the yolk, evoking a premium dining experience in a midnight bistro setting." src="https://lh3.googleusercontent.com/aida-public/AB6AXuABJdnruoFQ5gSYvJf28jPRsZS-1C4SIkLC9T2S2j5-fKsaJXwGwNN9aPzTSeC5CAlgqz5-qT2tBgiMJsqlMe9jBOk-4Nr3m57eU8L_HRc72JZj232rbE20-pScnDp3yscw75dypoPrvRCqDh7ZECMjZGtQWdsB5PjguF53AKQ_fhnDBQPPYZOsWn1oZ36VjHc-S4j9dv45w97zYb_2sqZyYLQMn4fCf5R_O7lqpMhvvq4GPp1BOceb3g"/>
</div>
<div>
<h3 class="font-body-md text-body-md text-on-surface font-medium">Truffle Gyudon</h3>
<p class="font-body-sm text-body-sm text-text-secondary mt-xs">1x</p>
</div>
</div>
<p class="font-mono-data text-mono-data text-on-surface">Rp 40.000</p>
</div>
</div>
<!-- Calculations -->
<div class="space-y-sm pt-sm">
<div class="flex justify-between items-center">
<span class="font-body-md text-body-md text-text-secondary">Subtotal</span>
<span class="font-mono-data text-mono-data text-on-surface">Rp 40.000</span>
</div>
<div class="flex justify-between items-center">
<span class="font-body-md text-body-md text-text-secondary">Ongkos Kirim</span>
<span class="font-mono-data text-mono-data text-on-surface">Rp 12.000</span>
</div>
<div class="flex justify-between items-center">
<span class="font-body-md text-body-md text-text-secondary">Diskon</span>
<span class="font-mono-data text-mono-data text-primary">- Rp 8.000</span>
</div>
</div>
<!-- Total -->
<div class="border-t border-border pt-md mt-md flex justify-between items-center">
<span class="font-headline-sm text-headline-sm text-on-surface">Total</span>
<span class="font-headline-sm text-headline-sm text-primary-container">Rp 44.000</span>
</div>
</div>
</section>
</main>
<!-- Floating Action Area (Bottom Fixed for CTA) -->
<div class="fixed bottom-0 left-0 w-full p-margin-mobile bg-surface/90 backdrop-blur-md border-t border-border z-40 md:relative md:bg-transparent md:border-t-0 md:mt-xl md:p-0 md:max-w-2xl md:mx-auto pb-safe">
<button class="w-full bg-primary-container text-on-primary-container font-headline-sm text-body-lg py-md rounded-xl hover:bg-inverse-primary transition-colors duration-300 shadow-[0_0_15px_rgba(200,76,44,0.2)]">
            Buat Pesanan
        </button>
</div>
</body></html>
